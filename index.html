<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>RolesWiki</title>
    <!-- ⚠️ アドレスの不備を完全に修正しました。これでデザインが強制適用されます -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        /* 参考サイト（NebulaWiki）のような黒・グレー系のカッコいいサイドバーに色を固定 */
        .sidebar { background-color: #2f3542 !important; color: #f5f6fa !important; width: 260px !important; }
        .sidebar-nav a { color: #a4b0be !important; }
        .sidebar-nav li a:hover, .sidebar-nav li.active > a { color: #ffffff !important; font-weight: bold; background: #57606f; border-radius: 4px; }
        .sidebar h1 a { color: #ffffff !important; }
        .content { margin-left: 260px !important; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name: 'RolesWiki',
            // 👈 これがONになっているので、ファイルを置くだけでサイドバーが自動更新されます！
            auto2top: true,
            maxLevel: 2
        }
    </script>
    <!-- ⚠️ 読み込みエラーが起きていたプログラムのアドレスを正しいものに直しました -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
